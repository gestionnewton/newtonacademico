<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Newton Académico</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/vZyCwnjS/icono-newton-academico-1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="justify-content: center; align-items: center; height: 100vh;">
    <div class="card" style="width: 100%; max-width: 400px; text-align: center;">
        <img src="https://i.postimg.cc/W45SpCYb/insignia-azul-sello.png" style="width: 100px;">
        <h2>Iniciar Sesión</h2>
        <form id="login-form">
            <input type="text" id="dni" placeholder="DNI (Nombre de usuario)" required 
                   style="width: 90%; padding: 10px; margin: 10px; border-radius: 8px; border: 1px solid #ccc;">
            <input type="password" id="password" placeholder="Contraseña" required
                   style="width: 90%; padding: 10px; margin: 10px; border-radius: 8px; border: 1px solid #ccc;">
            <button type="submit" class="btn-primary" style="width: 95%;">Entrar</button>
        </form>
        <p id="error-msg" style="color: red;"></p>
    </div>

    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
</body>
</html>
